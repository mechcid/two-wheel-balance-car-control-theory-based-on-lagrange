# LQR 统一配置：修改后运行 .venv/bin/python control/generate_lqr.py
# 所有角度使用 rad；所有惯量均为质心处、刚体自身坐标系中的 kg·m²。
# 惯量非对角项填矩阵实际元素；本项目 SolidWorks 正张量记数法的惯性积需取反，kg·mm² 乘 1e-6。
# 车体保留完整惯量；车轮必须左右相同且绕 y 轴轴对称，不能通过增加轮惯性积改变模型。
[physical]
r = 0.0325 # 车轮半径，m
d = 0.185 # 左右轮中心平面间距，m
l = 0.041527 # 车轴中点到车体质心的高度，m；忽略质心横向和前后偏移
m_B = 0.831 # 不含车轮的车体质量，kg（包含电机、车架、电池）
m_L = 0.046 # 左车轮质量，kg
m_R = 0.046 # 右车轮质量，kg
I_Bxx = 0.004242183 # 车体绕 x 轴的转动惯量，kg·m²
I_Byy = 0.002739328 # 车体绕 y 轴的转动惯量，kg·m²
I_Bzz = 0.002748923 # 车体绕 z 轴的转动惯量，kg·m²
I_Bxy = 0.000582953 # 车体惯量矩阵 xy 非对角元素，kg·m²
I_Bxz = -5.33e-07 # 车体惯量矩阵 xz 非对角元素，kg·m²
I_Byz = -1.59e-07 # 车体惯量矩阵 yz 非对角元素，kg·m²
I_Lxx = 1.8339e-05 # 左轮绕 x 轴的转动惯量，kg·m²
I_Lyy = 3.1441e-05 # 左轮绕 y 轴的转动惯量，kg·m²
I_Lzz = 1.8339e-05 # 左轮绕 z 轴的转动惯量，kg·m²
I_Rxx = 1.8339e-05 # 右轮绕 x 轴的转动惯量，kg·m²
I_Ryy = 3.1441e-05 # 右轮绕 y 轴的转动惯量，kg·m²
I_Rzz = 1.8339e-05 # 右轮绕 z 轴的转动惯量，kg·m²
g = 9.81 # 重力加速度，m/s²
psi0 = 0.0 # 静止模型名义偏航角，rad；快捷入口要求为 0，x 即名义前向

[design]
# continuous：连续时间 CARE；discrete：零阶保持离散模型 + DARE。
domain = "discrete"
# 离散设计控制周期，s。0.005 为 200 Hz 示例，需与你的控制任务实际周期一致。
sample_time = 0.005
# Q/R 定义为每拍离散代价（discrete）或连续时间积分代价（continuous）。
# 不自动将连续代价积分转换为离散代价；两类设计即使填写相同数值，K 也不同。

[origin_static_balance]
enabled = true
# Q：按 [x, psi, theta, x_dot, psi_dot, theta_dot] 的误差顺序。
# 单位依次 [m, rad, rad, m/s, rad/s, rad/s]。一维列表表示对角线。
# 也可填完整对称 6×6 嵌套数组，必须半正定。
Q = [2400.0, 5.0, 400.0, 5.0, 2.0, 40.0]
# R：按 [左轮力矩, 右轮力矩]，输入单位 N·m；允许完整对称正定 2×2 数组。
R = [1.0, 1.0]

[turning]
enabled = true
# 恒定前向速度 m/s、恒定偏航角速度 rad/s；正偏航为左转。
# 两者不能同时为零；静止请使用 origin_static_balance。圆周半径绝对值为 abs(v0/omega0)。
v0 = 0.1
omega0 = 0.4
# Q：按 [沿参考朝向位置误差, 参考左侧位置误差, 偏航误差, 俯仰误差,
#         前向速度误差, 偏航角速度误差, 俯仰角速度误差]。
# 单位 [m, m, rad, rad, m/s, rad/s, rad/s]；允许完整对称半正定 7×7 数组。
Q = [10.0, 10.0, 5.0, 400.0, 5.0, 2.0, 40.0]
# 左右轮力矩增量的权重，允许完整对称正定 2×2 数组。
R = [10.0, 10.0]
